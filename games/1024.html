<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>1024 — Mukammal versiya</title>
  <style>
    :root {
      --bg: #faf8ef;
      --board: #bbada0;
      --cell: #cdc1b4;
      --text: #776e65;
      --accent: #8f7a66;
      --overlay-bg: rgba(238, 228, 218, 0.85);
    }

    [data-theme="dark"] {
      --bg: #121212;
      --board: #2d2d2d;
      --cell: #3d3d3d;
      --text: #e0e0e0;
      --accent: #6b6b6b;
      --overlay-bg: rgba(30, 30, 30, 0.9);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 16px 24px;
      user-select: none;
      overflow-x: hidden;
    }

    a.back {
      color: #4fd1c5;
      text-decoration: none;
      font-size: 15px;
      align-self: flex-start;
      margin-bottom: 8px;
    }

    header {
      width: 100%;
      max-width: 420px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    h1 {
      font-size: 42px;
      margin: 0;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .scores {
      display: flex;
      gap: 8px;
    }

    .score-box {
      background: var(--board);
      color: #fff;
      border-radius: 8px;
      padding: 6px 14px;
      text-align: center;
      min-width: 78px;
      box-shadow: 0 2px 0 rgba(0,0,0,0.1);
    }

    .score-box small {
      display: block;
      font-size: 11px;
      opacity: 0.85;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .score-box span {
      font-size: 22px;
      font-weight: 700;
    }

    .controls {
      margin: 14px 0 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 9px 16px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: filter 0.15s, transform 0.1s;
    }

    button:hover { filter: brightness(1.12); }
    button:active { transform: scale(0.96); }
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    .hint {
      margin: 6px 0 14px;
      font-size: 13.5px;
      opacity: 0.75;
      text-align: center;
      max-width: 380px;
      line-height: 1.4;
    }

    .board-wrap {
      position: relative;
      width: 100%;
      max-width: 420px;
    }

    .board {
      position: relative;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      background: var(--board);
      border-radius: 12px;
      padding: 10px;
      aspect-ratio: 1;
      touch-action: none;
      box-shadow: 0 6px 20px rgba(0,0,0,0.12);
    }

    .cell {
      background: var(--cell);
      border-radius: 8px;
      aspect-ratio: 1;
    }

    .tile {
      position: absolute;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: clamp(20px, 7vw, 38px);
      color: #776e65;
      transition: transform 0.12s ease-out, opacity 0.12s;
      z-index: 2;
      box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    }

    .tile-new {
      animation: appear 0.18s ease-out;
    }

    .tile-merged {
      animation: merge 0.18s ease-out;
    }

    @keyframes appear {
      from { transform: scale(0.4); opacity: 0.4; }
      to   { transform: scale(1);   opacity: 1; }
    }

    @keyframes merge {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.18); }
      100% { transform: scale(1); }
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: var(--overlay-bg);
      border-radius: 12px;
      color: var(--text);
      font-size: 28px;
      font-weight: 800;
      text-align: center;
      z-index: 20;
      backdrop-filter: blur(4px);
    }

    .overlay.show { display: flex; }

    .overlay-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .footer {
      margin-top: 18px;
      font-size: 13px;
      opacity: 0.6;
      text-align: center;
    }
  </style>
</head>
<body>
  <a href="../index.html" class="back">← Menyu</a>

  <header>
    <h1>1024</h1>
    <div class="scores">
      <div class="score-box">
        <small>Ball</small>
        <span id="score">0</span>
      </div>
      <div class="score-box">
        <small>Eng yaxshi</small>
        <span id="best">0</span>
      </div>
    </div>
  </header>

  <div class="controls">
    <button id="new-game">Yangi o‘yin</button>
    <button id="undo" disabled>Orqaga</button>
    <button id="sound">Ovoz: Yoq</button>
    <button id="theme">Mavzu</button>
  </div>

  <p class="hint">
    Strelkalar yoki WASD bilan harakatlantiring.<br>
    Telefonda barmoq bilan suring. Maqsad: <strong>1024</strong>!
  </p>

  <div class="board-wrap">
    <div class="board" id="board"></div>
    <div class="overlay" id="overlay">
      <div id="overlay-text"></div>
      <div class="overlay-buttons">
        <button id="keep-going">Davom etish</button>
        <button id="restart">Qayta boshlash</button>
      </div>
    </div>
  </div>

  <div class="footer">Mukammal 1024 • O‘zbekcha versiya</div>

  <script>
    (() => {
      const SIZE = 4;
      const TARGET = 1024;
      const BEST_KEY = "game1024-best-v2";
      const THEME_KEY = "game1024-theme";
      const SOUND_KEY = "game1024-sound";

      const COLORS = {
        2:    ["#eee4da", "#776e65"],
        4:    ["#ede0c8", "#776e65"],
        8:    ["#f2b179", "#f9f6f2"],
        16:   ["#f59563", "#f9f6f2"],
        32:   ["#f67c5f", "#f9f6f2"],
        64:   ["#f65e3b", "#f9f6f2"],
        128:  ["#edcf72", "#f9f6f2"],
        256:  ["#edcc61", "#f9f6f2"],
        512:  ["#edc850", "#f9f6f2"],
        1024: ["#edc53f", "#f9f6f2"],
        2048: ["#edc22e", "#f9f6f2"],
        4096: ["#3c3a32", "#f9f6f2"],
        8192: ["#3c3a32", "#f9f6f2"],
      };

      // DOM
      const boardEl   = document.getElementById("board");
      const scoreEl   = document.getElementById("score");
      const bestEl    = document.getElementById("best");
      const overlay   = document.getElementById("overlay");
      const overlayText = document.getElementById("overlay-text");
      const undoBtn   = document.getElementById("undo");
      const soundBtn  = document.getElementById("sound");

      // State
      let grid = [];
      let score = 0;
      let best = 0;
      let won = false;
      let keepPlaying = false;
      let animating = false;
      let history = [];
      let soundEnabled = true;
      let tileId = 0;

      // Audio (Web Audio API – hech qanday fayl kerak emas)
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      function playSound(type) {
        if (!soundEnabled) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === "move") {
          osc.frequency.value = 180;
          gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.08);
        } else if (type === "merge") {
          osc.frequency.value = 320;
          gain.gain.setValueAtTime(0.09, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.12);
        } else if (type === "win") {
          osc.frequency.setValueAtTime(440, audioCtx.currentTime);
          osc.frequency.linearRampToValueAtTime(880, audioCtx.currentTime + 0.3);
          gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.4);
        }
      }

      // ——— Yordamchi funksiyalar ———
      function loadBest() {
        try { return Number(localStorage.getItem(BEST_KEY)) || 0; } catch { return 0; }
      }
      function saveBest(v) {
        try { localStorage.setItem(BEST_KEY, String(v)); } catch {}
      }

      function emptyGrid() {
        return Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
      }

      function cloneGrid(g) {
        return g.map(row => [...row]);
      }

      function addRandomTile() {
        const empty = [];
        for (let r = 0; r < SIZE; r++)
          for (let c = 0; c < SIZE; c++)
            if (grid[r][c] === 0) empty.push([r, c]);

        if (!empty.length) return null;
        const [r, c] = empty[Math.floor(Math.random() * empty.length)];
        grid[r][c] = Math.random() < 0.9 ? 2 : 4;
        return [r, c];
      }

      // ——— O‘yin logikasi ———
      function slideRow(row) {
        const values = row.filter(v => v !== 0);
        const out = [];
        let gained = 0;
        let merged = false;

        for (let i = 0; i < values.length; i++) {
          if (values[i] === values[i + 1]) {
            const m = values[i] * 2;
            out.push(m);
            gained += m;
            merged = true;
            i++;
          } else {
            out.push(values[i]);
          }
        }
        while (out.length < SIZE) out.push(0);
        return { row: out, gained, merged };
      }

      function lineCoords(dir, i, j) {
        switch (dir) {
          case "left":  return [i, j];
          case "right": return [i, SIZE - 1 - j];
          case "up":    return [j, i];
          case "down":  return [SIZE - 1 - j, i];
        }
      }

      function move(direction) {
        if (animating || (won && !keepPlaying)) return;

        // Tarixni saqlash (undo uchun)
        history.push({
          grid: cloneGrid(grid),
          score,
          won,
          keepPlaying
        });
        if (history.length > 20) history.shift();

        const before = JSON.stringify(grid);
        let gainedTotal = 0;
        let anyMerged = false;

        for (let i = 0; i < SIZE; i++) {
          const line = [];
          for (let j = 0; j < SIZE; j++) {
            const [r, c] = lineCoords(direction, i, j);
            line.push(grid[r][c]);
          }
          const { row, gained, merged } = slideRow(line);
          gainedTotal += gained;
          if (merged) anyMerged = true;
          for (let j = 0; j < SIZE; j++) {
            const [r, c] = lineCoords(direction, i, j);
            grid[r][c] = row[j];
          }
        }

        if (before === JSON.stringify(grid)) {
          history.pop(); // harakat bo‘lmagan
          return;
        }

        score += gainedTotal;
        if (score > best) {
          best = score;
          saveBest(best);
        }

        playSound(anyMerged ? "merge" : "move");

        const newPos = addRandomTile();
        render(true, newPos);

        // G‘alaba / yutqazish tekshiruvi
        if (!won && grid.flat().some(v => v >= TARGET)) {
          won = true;
          playSound("win");
          overlayText.textContent = "Tabriklaymiz!\n1024 yutdingiz!";
          overlay.classList.add("show");
        } else if (!canMove()) {
          overlayText.textContent = "O‘yin tugadi";
          overlay.classList.add("show");
        }

        undoBtn.disabled = history.length === 0;
      }

      function canMove() {
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            const v = grid[r][c];
            if (v === 0) return true;
            if (c + 1 < SIZE && grid[r][c + 1] === v) return true;
            if (r + 1 < SIZE && grid[r + 1][c] === v) return true;
          }
        }
        return false;
      }

      function undo() {
        if (history.length === 0 || animating) return;
        const prev = history.pop();
        grid = prev.grid;
        score = prev.score;
        won = prev.won;
        keepPlaying = prev.keepPlaying;
        overlay.classList.remove("show");
        render(false);
        undoBtn.disabled = history.length === 0;
      }

      // ——— Render ———
      function getTileSize() {
        const boardRect = boardEl.getBoundingClientRect();
        const gap = 10;
        const padding = 10;
        return (boardRect.width - padding * 2 - gap * 3) / 4;
      }

      function render(animate = false, newTilePos = null) {
        // Eski plitkalarni o‘chirish
        boardEl.querySelectorAll(".tile").forEach(t => t.remove());

        // Fon kataklarini yaratish (bir marta)
        if (boardEl.children.length < SIZE * SIZE) {
          boardEl.innerHTML = "";
          for (let i = 0; i < SIZE * SIZE; i++) {
            const cell = document.createElement("div");
            cell.className = "cell";
            boardEl.appendChild(cell);
          }
        }

        const size = getTileSize();
        const gap = 10;
        const pad = 10;

        scoreEl.textContent = score;
        bestEl.textContent = best;

        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            const v = grid[r][c];
            if (!v) continue;

            const tile = document.createElement("div");
            tile.className = "tile";
            tile.textContent = v;

            const [bg, fg] = COLORS[v] || ["#3c3a32", "#f9f6f2"];
            tile.style.background = bg;
            tile.style.color = fg;
            tile.style.width = size + "px";
            tile.style.height = size + "px";
            tile.style.left = (pad + c * (size + gap)) + "px";
            tile.style.top  = (pad + r * (size + gap)) + "px";

            if (v >= 1000) {
              tile.style.fontSize = "clamp(15px, 4.8vw, 28px)";
            }

            if (animate && newTilePos && newTilePos[0] === r && newTilePos[1] === c) {
              tile.classList.add("tile-new");
            }

            boardEl.appendChild(tile);
          }
        }
      }

      // ——— Boshqaruv ———
      function newGame() {
        grid = emptyGrid();
        score = 0;
        won = false;
        keepPlaying = false;
        history = [];
        overlay.classList.remove("show");
        addRandomTile();
        addRandomTile();
        render(false);
        undoBtn.disabled = true;
      }

      // Klaviatura
      const KEYS = {
        ArrowLeft: "left", a: "left", A: "left",
        ArrowRight: "right", d: "right", D: "right",
        ArrowUp: "up", w: "up", W: "up",
        ArrowDown: "down", s: "down", S: "down",
      };

      document.addEventListener("keydown", e => {
        const dir = KEYS[e.key];
        if (dir) {
          e.preventDefault();
          move(dir);
        }
      });

      // Touch
      let touchStart = null;
      boardEl.addEventListener("touchstart", e => {
        const t = e.touches[0];
        touchStart = [t.clientX, t.clientY];
      }, { passive: true });

      boardEl.addEventListener("touchend", e => {
        if (!touchStart) return;
        const t = e.changedTouches[0];
        const dx = t.clientX - touchStart[0];
        const dy = t.clientY - touchStart[1];
        touchStart = null;
        if (Math.max(Math.abs(dx), Math.abs(dy)) < 28) return;
        if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? "right" : "left");
        else move(dy > 0 ? "down" : "up");
      });

      // Tugmalar
      document.getElementById("new-game").addEventListener("click", newGame);
      document.getElementById("restart").addEventListener("click", newGame);
      document.getElementById("keep-going").addEventListener("click", () => {
        keepPlaying = true;
        overlay.classList.remove("show");
      });
      undoBtn.addEventListener("click", undo);

      // Ovoz
      soundBtn.addEventListener("click", () => {
        soundEnabled = !soundEnabled;
        soundBtn.textContent = soundEnabled ? "Ovoz: Yoq" : "Ovoz: O‘ch";
        try { localStorage.setItem(SOUND_KEY, soundEnabled ? "1" : "0"); } catch {}
      });

      // Mavzu
      document.getElementById("theme").addEventListener("click", () => {
        const root = document.documentElement;
        const isDark = root.dataset.theme === "dark";
        root.dataset.theme = isDark ? "light" : "dark";
        try { localStorage.setItem(THEME_KEY, root.dataset.theme); } catch {}
      });

      // Oyna o‘lchami o‘zgarganda qayta chizish
      window.addEventListener("resize", () => render(false));

      // Ishga tushirish
      best = loadBest();
      try {
        const savedTheme = localStorage.getItem(THEME_KEY);
        if (savedTheme) document.documentElement.dataset.theme = savedTheme;
        const savedSound = localStorage.getItem(SOUND_KEY);
        if (savedSound === "0") {
          soundEnabled = false;
          soundBtn.textContent = "Ovoz: O‘ch";
        }
      } catch {}

      newGame();
    })();
  </script>
</body>
</html>
