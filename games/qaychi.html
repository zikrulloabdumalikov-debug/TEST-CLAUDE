<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qaychi-qog'oz-tosh</title>
<style>
  body { margin: 0; min-height: 100vh; background: #15171c; color: #eee; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 16px; box-sizing: border-box; }
  a { color: #4fd1c5; align-self: flex-start; }
  .row { display: flex; gap: 10px; margin: 16px 0; }
  .row button { width: 96px; height: 96px; font-size: 40px; background: #262a33; border: 0; border-radius: 12px; cursor: pointer; }
  #result { font-size: 20px; min-height: 30px; }
  #score { font-size: 18px; margin: 8px 0; }
  button.reset { background: #4fd1c5; color: #111; border: 0; border-radius: 6px; padding: 10px 16px; font-size: 15px; cursor: pointer; }
</style>
</head>
<body>
<a href="../index.html">← Menyu</a>
<h1>Qaychi-qog'oz-tosh</h1>
<p id="score">Siz 0 : 0 Kompyuter</p>
<div class="row">
  <button data-m="rock" title="Tosh">✊</button>
  <button data-m="paper" title="Qog'oz">✋</button>
  <button data-m="scissors" title="Qaychi">✌️</button>
</div>
<p id="result">Tanlang!</p>
<button class="reset" id="reset">Hisobni tozalash</button>
<script>
  const BEATS = { rock: "scissors", paper: "rock", scissors: "paper" };
  const NAMES = { rock: "Tosh", paper: "Qog'oz", scissors: "Qaychi" };
  const MOVES = Object.keys(BEATS);
  let you = 0, ai = 0;

  function show() {
    document.getElementById("score").textContent = `Siz ${you} : ${ai} Kompyuter`;
  }

  document.querySelectorAll("button[data-m]").forEach(btn => {
    btn.addEventListener("click", () => {
      const mine = btn.dataset.m;
      const theirs = MOVES[Math.floor(Math.random() * MOVES.length)];
      let text;
      if (mine === theirs) text = "Durang.";
      else if (BEATS[mine] === theirs) { you++; text = "Siz yutdingiz!"; }
      else { ai++; text = "Kompyuter yutdi."; }
      document.getElementById("result").textContent = `${NAMES[mine]} vs ${NAMES[theirs]} — ${text}`;
      show();
    });
  });

  document.getElementById("reset").addEventListener("click", () => {
    you = 0; ai = 0;
    document.getElementById("result").textContent = "Tanlang!";
    show();
  });
</script>
</body>
</html>
