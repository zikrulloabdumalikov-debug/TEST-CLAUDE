<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mina topish</title>
<style>
  body { margin: 0; min-height: 100vh; background: #15171c; color: #eee; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 16px; box-sizing: border-box; }
  a { color: #4fd1c5; align-self: flex-start; }
  #grid { display: grid; grid-template-columns: repeat(8, 36px); gap: 3px; margin: 16px 0; }
  .c { width: 36px; height: 36px; border: 0; border-radius: 4px; background: #3b4252; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; padding: 0; }
  .c.open { background: #1e2129; cursor: default; }
  .c.mine { background: #c53030; }
  button.reset { background: #4fd1c5; color: #111; border: 0; border-radius: 6px; padding: 10px 16px; font-size: 15px; cursor: pointer; }
  p { margin: 6px 0; text-align: center; }
</style>
</head>
<body>
<a href="../index.html">← Menyu</a>
<h1>Mina topish</h1>
<p>Chap tugma: ochish. O'ng tugma (yoki uzoq bosish): bayroq qo'yish.</p>
<p>Minalar: 10</p>
<div id="grid"></div>
<p id="status"></p>
<button class="reset" id="reset">Yangi o'yin</button>
<script>
  const N = 8, MINES = 10;
  const gridEl = document.getElementById("grid");
  const statusEl = document.getElementById("status");
  let mines, open, flags, counts, over, opened;

  function newGame() {
    mines = Array.from({ length: N * N }, () => false);
    let placed = 0;
    while (placed < MINES) {
      const i = Math.floor(Math.random() * N * N);
      if (!mines[i]) { mines[i] = true; placed++; }
    }
    counts = Array(N * N).fill(0);
    for (let i = 0; i < N * N; i++) counts[i] = neighbors(i).filter(j => mines[j]).length;
    open = Array(N * N).fill(false);
    flags = Array(N * N).fill(false);
    over = false; opened = 0;
    statusEl.textContent = "";
    render();
  }

  function neighbors(i) {
    const r = Math.floor(i / N), c = i % N, out = [];
    for (let dr = -1; dr <= 1; dr++)
      for (let dc = -1; dc <= 1; dc++) {
        if (!dr && !dc) continue;
        const rr = r + dr, cc = c + dc;
        if (rr >= 0 && rr < N && cc >= 0 && cc < N) out.push(rr * N + cc);
      }
    return out;
  }

  // Opening an empty cell reveals its neighbours too, recursively.
  function reveal(i) {
    if (open[i] || flags[i]) return;
    open[i] = true;
    opened++;
    if (mines[i]) { lose(); return; }
    if (counts[i] === 0) neighbors(i).forEach(reveal);
  }

  function lose() {
    over = true;
    mines.forEach((m, i) => { if (m) open[i] = true; });
    statusEl.textContent = "Mina portladi! Yutqazdingiz.";
    render();
  }

  function checkWin() {
    if (!over && opened === N * N - MINES) {
      over = true;
      statusEl.textContent = "Tabriklaymiz, hammasini topdingiz!";
    }
  }

  function render() {
    gridEl.innerHTML = "";
    for (let i = 0; i < N * N; i++) {
      const btn = document.createElement("button");
      btn.className = "c";
      if (open[i]) {
        btn.classList.add("open");
        if (mines[i]) { btn.classList.add("mine"); btn.textContent = "💣"; }
        else if (counts[i]) btn.textContent = counts[i];
      } else if (flags[i]) {
        btn.textContent = "🚩";
      }
      btn.addEventListener("click", () => {
        if (over) return;
        reveal(i);
        render();
        checkWin();
      });
      btn.addEventListener("contextmenu", e => {
        e.preventDefault();
        if (over || open[i]) return;
        flags[i] = !flags[i];
        render();
      });
      gridEl.appendChild(btn);
    }
  }

  document.getElementById("reset").addEventListener("click", newGame);
  newGame();
</script>
</body>
</html>
