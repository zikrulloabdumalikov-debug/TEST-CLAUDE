<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xotira</title>
<style>
  body { margin: 0; min-height: 100vh; background: #15171c; color: #eee; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 16px; box-sizing: border-box; }
  a { color: #4fd1c5; align-self: flex-start; }
  #grid { display: grid; grid-template-columns: repeat(4, 72px); gap: 8px; margin: 16px 0; }
  .card { width: 72px; height: 72px; border: 0; border-radius: 8px; background: #3b4252; font-size: 32px; cursor: pointer; color: transparent; }
  .card.open, .card.done { color: #fff; }
  .card.open { background: #4fd1c5; }
  .card.done { background: #2f855a; }
  button.reset { background: #4fd1c5; color: #111; border: 0; border-radius: 6px; padding: 10px 16px; font-size: 15px; cursor: pointer; }
</style>
</head>
<body>
<a href="../index.html">← Menyu</a>
<h1>Xotira</h1>
<p>Juftliklarni toping. Urinishlar: <span id="moves">0</span></p>
<div id="grid"></div>
<button class="reset" id="reset">Yangi o'yin</button>
<script>
  const SYMBOLS = ["🍎", "🍌", "🍇", "🍓", "🍒", "🥝", "🍑", "🍍"];
  const gridEl = document.getElementById("grid");
  const movesEl = document.getElementById("moves");
  let cards, first, lock, moves, matched;

  function newGame() {
    const deck = [...SYMBOLS, ...SYMBOLS];
    // Fisher-Yates shuffle
    for (let i = deck.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [deck[i], deck[j]] = [deck[j], deck[i]];
    }
    cards = deck.map(sym => ({ sym, open: false, done: false }));
    first = null; lock = false; moves = 0; matched = 0;
    movesEl.textContent = 0;
    render();
  }

  function render() {
    gridEl.innerHTML = "";
    cards.forEach((c, i) => {
      const btn = document.createElement("button");
      btn.className = "card" + (c.done ? " done" : c.open ? " open" : "");
      btn.textContent = c.open || c.done ? c.sym : "";
      btn.addEventListener("click", () => flip(i));
      gridEl.appendChild(btn);
    });
  }

  function flip(i) {
    const c = cards[i];
    if (lock || c.open || c.done) return;
    c.open = true;
    render();
    if (first === null) { first = i; return; }
    moves++;
    movesEl.textContent = moves;
    const a = cards[first];
    if (a.sym === c.sym) {
      a.done = c.done = true; a.open = c.open = false;
      matched++;
      first = null;
      render();
      if (matched === SYMBOLS.length) setTimeout(() => alert(`Tabriklaymiz! ${moves} urinishda topdingiz.`), 100);
    } else {
      lock = true;
      setTimeout(() => {
        a.open = c.open = false;
        first = null; lock = false;
        render();
      }, 800);
    }
  }

  document.getElementById("reset").addEventListener("click", newGame);
  newGame();
</script>
</body>
</html>
