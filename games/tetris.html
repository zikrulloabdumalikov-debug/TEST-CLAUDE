<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tetris</title>
<style>
  body { margin: 0; min-height: 100vh; background: #15171c; color: #eee; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 16px; box-sizing: border-box; }
  a { color: #4fd1c5; align-self: flex-start; }
  canvas { background: #000; border-radius: 8px; max-width: 100%; }
  p { margin: 6px 0; text-align: center; }
  .pad { display: grid; grid-template-columns: repeat(3, 64px); gap: 6px; margin-top: 10px; }
  .pad button { height: 52px; font-size: 20px; background: #262a33; color: #eee; border: 0; border-radius: 8px; cursor: pointer; }
</style>
</head>
<body>
<a href="../index.html">← Menyu</a>
<h1>Tetris</h1>
<p>Strelkalar: harakat va aylantirish (↑). Pastga (↓) tezroq tushadi. Ochko: <span id="score">0</span></p>
<canvas id="c" width="240" height="400"></canvas>
<div class="pad">
  <span></span><button data-k="ArrowUp">↻</button><span></span>
  <button data-k="ArrowLeft">←</button><button data-k="ArrowDown">↓</button><button data-k="ArrowRight">→</button>
</div>
<p id="msg">Boshlash uchun Enter bosing</p>
<script>
  const cv = document.getElementById("c"), ctx = cv.getContext("2d");
  const COLS = 10, ROWS = 20, S = 20;
  const SHAPES = {
    I: [[1, 1, 1, 1]], O: [[1, 1], [1, 1]], T: [[0, 1, 0], [1, 1, 1]],
    S: [[0, 1, 1], [1, 1, 0]], Z: [[1, 1, 0], [0, 1, 1]], J: [[1, 0, 0], [1, 1, 1]], L: [[0, 0, 1], [1, 1, 1]]
  };
  const COLORS = { I: "#4fd1c5", O: "#ecc94b", T: "#b794f4", S: "#68d391", Z: "#fc8181", J: "#63b3ed", L: "#ed8936" };
  let board, piece, score, over, timer;

  function emptyBoard() { return Array.from({ length: ROWS }, () => Array(COLS).fill("")); }

  function randomPiece() {
    const keys = Object.keys(SHAPES);
    const k = keys[Math.floor(Math.random() * keys.length)];
    const shape = SHAPES[k].map(r => [...r]);
    return { k, shape, x: Math.floor((COLS - shape[0].length) / 2), y: 0 };
  }

  function fits(shape, x, y) {
    for (let r = 0; r < shape.length; r++)
      for (let c = 0; c < shape[r].length; c++) {
        if (!shape[r][c]) continue;
        const bx = x + c, by = y + r;
        if (bx < 0 || bx >= COLS || by >= ROWS) return false;
        if (by >= 0 && board[by][bx]) return false;
      }
    return true;
  }

  function lock() {
    piece.shape.forEach((row, r) => row.forEach((v, c) => {
      if (v && piece.y + r >= 0) board[piece.y + r][piece.x + c] = piece.k;
    }));
    let cleared = 0;
    for (let r = ROWS - 1; r >= 0; r--) {
      if (board[r].every(v => v)) { board.splice(r, 1); board.unshift(Array(COLS).fill("")); cleared++; r++; }
    }
    score += cleared * 100;
    document.getElementById("score").textContent = score;
    piece = randomPiece();
    if (!fits(piece.shape, piece.x, piece.y)) gameOver();
  }

  function step() {
    if (fits(piece.shape, piece.x, piece.y + 1)) piece.y++;
    else lock();
    draw();
  }

  function rotate() {
    const s = piece.shape;
    const rotated = s[0].map((_, c) => s.map(row => row[c]).reverse());
    if (fits(rotated, piece.x, piece.y)) piece.shape = rotated;
  }

  function move(dx) {
    if (fits(piece.shape, piece.x + dx, piece.y)) piece.x += dx;
  }

  function gameOver() {
    clearInterval(timer);
    over = true;
    draw();
    document.getElementById("msg").textContent = "O'yin tugadi. Qayta boshlash uchun Enter bosing.";
  }

  function start() {
    board = emptyBoard(); score = 0; over = false;
    document.getElementById("score").textContent = score;
    piece = randomPiece();
    document.getElementById("msg").textContent = "";
    clearInterval(timer);
    timer = setInterval(step, 500);
    draw();
  }

  function draw() {
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, cv.width, cv.height);
    board.forEach((row, r) => row.forEach((k, c) => {
      if (k) { ctx.fillStyle = COLORS[k]; ctx.fillRect(c * S + 1, r * S + 1, S - 2, S - 2); }
    }));
    if (piece) {
      ctx.fillStyle = COLORS[piece.k];
      piece.shape.forEach((row, r) => row.forEach((v, c) => {
        if (v && piece.y + r >= 0) ctx.fillRect((piece.x + c) * S + 1, (piece.y + r) * S + 1, S - 2, S - 2);
      }));
    }
  }

  document.addEventListener("keydown", e => {
    if (e.key === "Enter") { if (!timer || over) start(); return; }
    if (!piece || over) return;
    if (e.key === "ArrowLeft") { e.preventDefault(); move(-1); }
    else if (e.key === "ArrowRight") { e.preventDefault(); move(1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); rotate(); }
    else if (e.key === "ArrowDown") { e.preventDefault(); step(); }
    draw();
  });
  document.querySelectorAll(".pad button").forEach(btn => btn.addEventListener("click", () => {
    if (!piece || over) return;
    const k = btn.dataset.k;
    if (k === "ArrowLeft") move(-1);
    else if (k === "ArrowRight") move(1);
    else if (k === "ArrowUp") rotate();
    else if (k === "ArrowDown") step();
    draw();
  }));

  board = emptyBoard();
  draw();
</script>
</body>
</html>
